<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyEyes — controle o cursor com os olhos</title>
  <meta name="description" content="Mova o cursor e clique usando apenas o movimento dos olhos, com a webcam comum. Gratuito, roda no navegador e o vídeo nunca sai do seu dispositivo.">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Cpath d='M6 32c8-14 18-20 26-20s18 6 26 20c-8 14-18 20-26 20S14 46 6 32z' fill='none' stroke='%235eead4' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%235eead4'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-state="welcome">
  <noscript><p style="padding:2rem">Este aplicativo precisa de JavaScript. / This app needs JavaScript.</p></noscript>

  <!-- 1. Boas-vindas / Welcome -->
  <section id="welcome" class="screen">
    <div class="card">
      <button class="lang-btn" data-action="lang" data-i18n="lang.switch">🌐 English</button>
      <h1><span class="logo" aria-hidden="true">👁</span> MyEyes</h1>
      <p class="lead" data-i18n-html="welcome.lead"></p>
      <ol class="steps">
        <li data-i18n-html="welcome.step1"></li>
        <li data-i18n-html="welcome.step2"></li>
        <li data-i18n-html="welcome.step3"></li>
      </ol>
      <ul class="tips">
        <li data-i18n="welcome.tip1"></li>
        <li data-i18n="welcome.tip2"></li>
        <li data-i18n="welcome.tip3"></li>
      </ul>
      <p id="welcome-error" class="error" role="alert" hidden></p>
      <button id="btn-start" class="big primary" autofocus data-i18n="welcome.start"></button>
      <p class="small" data-i18n="welcome.note"></p>
    </div>
  </section>

  <!-- 2. Carregando / Loading -->
  <section id="loading" class="screen" hidden>
    <div class="card center">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text" role="status" data-i18n="loading.default"></p>
    </div>
  </section>

  <!-- 3. Calibração / Calibration -->
  <section id="calib" class="screen calib" hidden>
    <p id="calib-label" class="calib-label" role="status"></p>
    <p id="calib-hint" class="calib-hint" role="alert"></p>
    <div id="calib-dot" class="calib-dot" aria-hidden="true"><i></i></div>
    <p class="calib-esc" data-i18n="calib.esc"></p>

    <div id="calib-result" class="card center" hidden>
      <h2 data-i18n="result.title"></h2>
      <p id="calib-quality" class="lead"></p>
      <p id="calib-tip" class="small"></p>
      <div class="row">
        <button class="big primary" data-gaze data-action="calib-accept" data-i18n="result.continue"></button>
        <button class="big" data-gaze data-action="calib-retry" data-i18n="result.retry"></button>
        <button class="big" data-gaze data-action="diag-open" data-i18n="btn.diag"></button>
      </div>
    </div>
  </section>

  <!-- 4. Aplicativo / App -->
  <main id="app" hidden>
    <header class="topbar">
      <div class="brand"><span aria-hidden="true">👁</span> MyEyes</div>
      <div id="face-status" class="badge" data-ok="false" role="status" data-i18n="face.searching"></div>
      <div class="spacer"></div>
      <button data-gaze data-action="diag-open" data-i18n="btn.diag"></button>
      <button data-gaze data-action="pause" data-i18n="btn.pause"></button>
      <button data-gaze data-action="recalibrate" data-i18n="btn.recalibrate"></button>
    </header>

    <div class="message-bar">
      <div id="message" class="message" aria-live="polite" data-i18n-ph="message.placeholder"></div>
      <button class="accent" data-gaze data-action="speak" data-i18n="btn.speak"></button>
      <button data-gaze data-action="clear" data-i18n="btn.clear"></button>
    </div>

    <nav class="tabs" role="tablist">
      <button role="tab" data-gaze data-action="tab" data-tab="phrases" data-i18n="tab.phrases"></button>
      <button role="tab" data-gaze data-action="tab" data-tab="keyboard" data-i18n="tab.keyboard"></button>
      <button role="tab" data-gaze data-action="tab" data-tab="settings" data-i18n="tab.settings"></button>
    </nav>

    <section id="tab-phrases" class="panel" role="tabpanel"></section>
    <section id="tab-keyboard" class="panel" role="tabpanel" hidden></section>
    <section id="tab-settings" class="panel" role="tabpanel" hidden></section>

    <div id="face-warning" class="warning" role="alert" hidden data-i18n="face.warning"></div>
  </main>

  <!-- Pausado / Paused -->
  <div id="paused" class="screen overlay" hidden>
    <div class="card center">
      <h2 data-i18n="paused.title"></h2>
      <p data-i18n="paused.text"></p>
      <button class="big primary" data-gaze data-resume data-action="resume" data-i18n="btn.resume"></button>
    </div>
  </div>

  <!-- Diagnóstico / Diagnostics -->
  <section id="diag" class="screen overlay diag" hidden>
    <div class="diag-card">
      <header class="diag-head">
        <h2 data-i18n="diag.title"></h2>
        <span id="diag-kind" class="badge" data-ok="true"></span>
      </header>
      <div class="diag-body">
        <div class="diag-left">
          <div id="diag-map" class="diag-map" role="img"></div>
          <p class="legend"><span class="lg lg-target"></span> <span data-i18n="diag.legend.target"></span> &nbsp; <span class="lg lg-pred"></span> <span data-i18n="diag.legend.pred"></span></p>
          <p id="diag-hint" class="small"></p>
        </div>
        <div class="diag-right">
          <dl id="diag-metrics" class="metrics"></dl>
          <h3 data-i18n="diag.findings"></h3>
          <ul id="diag-findings" class="findings"></ul>
        </div>
      </div>
      <div class="diag-actions">
        <button class="big primary" data-gaze data-action="diag-close" data-i18n="diag.btn.back"></button>
        <button class="big" data-gaze data-action="diag-test" data-i18n="diag.btn.test"></button>
        <button id="diag-switch" class="big" data-gaze data-action="diag-switch" hidden></button>
        <button id="diag-improve" class="big accent" data-gaze data-action="diag-improve" data-i18n="diag.btn.improve" hidden></button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <video id="cam" playsinline muted></video>

  <div id="gaze-cursor" hidden aria-hidden="true">
    <svg viewBox="0 0 64 64">
      <circle class="track" cx="32" cy="32" r="26"></circle>
      <circle id="cursor-progress" class="progress" cx="32" cy="32" r="26"></circle>
    </svg>
    <span class="dot"></span>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
